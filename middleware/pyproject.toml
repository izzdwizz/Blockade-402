[project]
name = "arc-llm-paywall-middleware"
version = "0.1.0"
description = "x402 facilitator gating an LLM call behind a USDC payment on Arc"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "web3>=7.0",
    "openai>=1.40",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
